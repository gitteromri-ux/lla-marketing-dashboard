<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julie Masterclass — Every Ad Set · Longevity Life Academy</title>
<link rel="stylesheet" href="styles.css?v=5">
<style>
:root{--ice:#BFE3FF;--sky:#7FC4FF;--neon:#2EA8FF}
body{font-size:22px}
.wrap{max-width:1500px;margin:0 auto;padding:40px 36px 120px;position:relative;z-index:1}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:46px}
.eyebrow{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;border:1px solid rgba(127,196,255,.45);background:rgba(0,110,255,.12);font-size:18px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--sky);box-shadow:0 0 40px -8px rgba(46,168,255,.8)}
.eyebrow i{width:12px;height:12px;border-radius:50%;background:#10B981;box-shadow:0 0 16px #10B981}
h1{font-size:clamp(56px,7vw,110px);font-weight:900;letter-spacing:-.045em;line-height:.95;margin:26px 0 14px;background:linear-gradient(90deg,#fff 0%,var(--ice) 50%,var(--neon) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(46,168,255,.55))}
.lead{font-size:clamp(24px,2.2vw,32px);color:#DCE8FF;font-weight:600;max-width:1200px;line-height:1.35}
.lead b{color:#fff}
.stamp{text-align:right;font-size:20px;color:var(--sky);font-weight:700;line-height:1.5}
.stamp b{display:block;color:#fff;font-size:26px}
/* hero numbers */
.heronums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin:44px 0 70px}
.hn{position:relative;padding:34px 34px 30px;border-radius:30px;border:1px solid rgba(127,196,255,.35);background:radial-gradient(500px 200px at 50% -40%,rgba(46,168,255,.45),transparent 70%),linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 90px -30px rgba(46,168,255,.9),inset 0 1px 0 rgba(255,255,255,.2)}
.hn .v{font-size:clamp(64px,6.4vw,104px);font-weight:900;letter-spacing:-.05em;line-height:1;color:#fff;text-shadow:0 0 40px rgba(127,196,255,.9),0 0 90px rgba(46,168,255,.6);font-variant-numeric:tabular-nums}
.hn .v small{font-size:.42em;color:var(--sky);font-weight:800;margin-left:6px}
.hn .l{margin-top:14px;font-size:20px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
/* ad set cards */
.sets{display:flex;flex-direction:column;gap:40px}
.set{position:relative;border:1px solid rgba(127,196,255,.3);border-radius:38px;padding:48px 52px;overflow:hidden;
  background:radial-gradient(900px 320px at 95% -10%,rgba(46,168,255,.28),transparent 65%),radial-gradient(600px 300px at -10% 110%,rgba(6,182,212,.18),transparent 65%),linear-gradient(155deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
  box-shadow:0 50px 110px -34px rgba(0,0,0,.95),0 0 120px -40px rgba(46,168,255,.8),inset 0 1px 0 rgba(255,255,255,.16)}
.set::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(180deg,#fff,var(--neon) 40%,rgba(46,168,255,.15));box-shadow:0 0 30px var(--neon)}
.set.off{box-shadow:0 50px 110px -34px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.1);border-color:rgba(255,255,255,.14)}
.set.off::before{background:linear-gradient(180deg,#9AA8C7,rgba(154,168,199,.15));box-shadow:none}
.shead{display:grid;grid-template-columns:120px 1fr auto;gap:34px;align-items:center;margin-bottom:38px}
.snum{width:120px;height:120px;border-radius:32px;display:grid;place-items:center;font-size:56px;font-weight:900;color:#02061A;background:linear-gradient(150deg,#fff 0%,var(--neon) 60%);box-shadow:0 24px 50px -14px var(--neon),0 0 60px -10px rgba(46,168,255,.9),inset 0 2px 4px rgba(255,255,255,.7)}
.set.off .snum{background:linear-gradient(150deg,#E6ECF8,#6B7AA0 60%);box-shadow:0 24px 50px -14px rgba(0,0,0,.6)}
.stitle{font-size:clamp(44px,4.4vw,68px);font-weight:900;letter-spacing:-.04em;line-height:1;color:#fff;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ssub{margin-top:12px;font-size:22px;font-weight:700;color:var(--sky);letter-spacing:.02em}
.ssub span{color:#DCE8FF;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border-radius:999px;font-size:22px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.pill.on{background:rgba(16,185,129,.16);color:#6EE7B7;border:1px solid rgba(16,185,129,.55);box-shadow:0 0 40px -8px rgba(16,185,129,.9)}
.pill.on::before{content:"";width:14px;height:14px;border-radius:50%;background:#10B981;box-shadow:0 0 18px #10B981}
.pill.off{background:rgba(255,255,255,.06);color:#B4C0DC;border:1px solid rgba(255,255,255,.2)}
.pill.off::before{content:"";width:14px;height:14px;border-radius:50%;background:#7F8DB0}
.budget{text-align:right}
.budget .m{font-size:clamp(64px,6vw,96px);font-weight:900;letter-spacing:-.05em;line-height:1;color:#fff;text-shadow:0 0 40px rgba(127,196,255,.9),0 0 90px rgba(46,168,255,.6);font-variant-numeric:tabular-nums}
.budget .m small{font-size:24px;color:var(--sky);font-weight:800;margin-left:6px}
.budget .r{margin-top:10px;font-size:20px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
/* config tiles */
.cfg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px;margin-bottom:30px}
.tile{padding:26px 26px 24px;border-radius:24px;background:rgba(0,110,255,.1);border:1px solid rgba(127,196,255,.28);box-shadow:inset 0 0 60px -30px rgba(46,168,255,.9)}
.tile .k{font-size:18px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
.tile .v{margin-top:12px;font-size:clamp(34px,3vw,46px);font-weight:900;letter-spacing:-.03em;line-height:1.05;color:#fff;text-shadow:0 0 30px rgba(127,196,255,.6)}
.tile .v.ice{color:var(--ice)}
.tile .v.txt{font-size:clamp(24px,1.9vw,30px);font-weight:800;line-height:1.25;color:#F4F7FF;letter-spacing:-.01em}
.rule{padding:30px 34px;border-radius:26px;background:rgba(255,255,255,.045);border:1px dashed rgba(127,196,255,.45);margin-bottom:38px}
.rule .k{font-size:18px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.rule .r{font-size:clamp(30px,2.8vw,42px);font-weight:900;letter-spacing:-.025em;line-height:1.3;color:#fff}
.rule .r b{color:var(--neon);text-shadow:0 0 24px rgba(46,168,255,.9);padding:0 10px}
.rule .list{margin-top:14px;font-size:24px;font-weight:600;color:var(--ice);line-height:1.6}
.tag{display:inline-flex;padding:9px 18px;border-radius:999px;font-size:18px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border:1px solid}
.tag.wide{color:#67E8F9;border-color:rgba(6,182,212,.6);background:rgba(6,182,212,.14)}
.tag.ii{color:var(--sky);border-color:rgba(127,196,255,.6);background:rgba(0,110,255,.18)}
.tag.rt{color:#D8CCFF;border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.16)}
/* ads */
.adsh{display:flex;align-items:baseline;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.adsh .t{font-size:34px;font-weight:900;letter-spacing:-.03em;color:#fff}
.adsh .c{font-size:22px;font-weight:800;color:var(--sky);letter-spacing:.1em;text-transform:uppercase}
.ads{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px}
.ad{border-radius:26px;overflow:hidden;border:1px solid rgba(127,196,255,.3);background:#050A1F;box-shadow:0 24px 50px -22px rgba(0,0,0,.9),0 0 50px -24px rgba(46,168,255,.8);transition:transform .25s}
.ad:hover{transform:translateY(-6px)}
.ad.off{opacity:.5;filter:saturate(.5)}
.ad.off{box-shadow:0 24px 50px -22px rgba(0,0,0,.9)}
.ad .ph{position:relative;aspect-ratio:1/1;background:#070C22}
.ad .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ad.static .ph img{object-fit:contain}
.ad .ph .st{position:absolute;left:14px;top:14px}
.ad .ph .st .pill{padding:8px 16px;font-size:16px}
.ad .nm{padding:18px 20px 20px;font-size:22px;font-weight:800;color:#fff;line-height:1.3;letter-spacing:-.01em}
.ad .nm small{display:block;margin-top:8px;font-size:18px;font-weight:700;color:var(--sky);letter-spacing:.03em}
.empty{padding:40px;border-radius:26px;border:1px dashed rgba(127,196,255,.4);text-align:center;font-size:30px;font-weight:800;color:var(--ice)}
.back{display:inline-flex;align-items:center;gap:10px;margin-top:60px;padding:18px 30px;border-radius:999px;font-size:22px;font-weight:800;color:#fff;text-decoration:none;background:linear-gradient(135deg,var(--brand),var(--neon));box-shadow:0 20px 50px -14px var(--neon)}
@media(max-width:1200px){.cfg{grid-template-columns:repeat(3,minmax(0,1fr))}.ads{grid-template-columns:repeat(3,minmax(0,1fr))}.heronums{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){body{font-size:20px}.wrap{padding:26px 18px 90px}.set{padding:30px 22px;border-radius:30px}.shead{grid-template-columns:84px 1fr}.snum{width:84px;height:84px;font-size:40px;border-radius:24px}
  .budget{grid-column:1/-1;text-align:left}.cfg{grid-template-columns:1fr 1fr}.ads{grid-template-columns:1fr 1fr}.heronums{grid-template-columns:1fr 1fr}.hn{padding:24px 20px}.hn .l{font-size:16px}.tile{padding:20px 18px}.rule{padding:22px 20px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow"><i></i> Longevity Life Academy · Julie Masterclass</div>
      <h1>Every ad set.<br>One screen.</h1>
      <p class="lead">Campaign <b>#118149</b> · all ad sets optimise for <b>Purchase</b> (pixel 1440305917310328), lowest cost, Advantage+ audience <b>off</b>. Dimmed sets hold ads but spend nothing until switched on.</p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>
  <section class="heronums" id="heronums"></section>
  <section class="sets" id="sets"></section>
  <a class="back" href="index.html">← Marketing Command Center</a>
</div>
<script src="campaign.js?v=5"></script>
<script>
(function(){
  var C=window.CAMPAIGN, sets=C.adsets.filter(function(a){return a.label.indexOf('TEST')!==0;});
  sets.sort(function(a,b){return a.label.localeCompare(b.label);});
  function M(n){return n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n);}
  function size(s){return s?M(s[0])+'–'+M(s[1]):'—';}
  function money(n){return '$'+Math.round(n).toLocaleString();}
  function st(a){return a.status==='ACTIVE'?'<span class="pill on">Live</span>':'<span class="pill off">Off</span>';}
  function tag(a){ if(a.custom&&a.custom.length) return '<span class="tag rt">Retargeting</span>'; return a.size&&a.size[0]>60e6?'<span class="tag wide">Wide audience</span>':'<span class="tag ii">Interest + intent</span>'; }
  function rule(a){
    if(a.custom&&a.custom.length) return '<div class="r">Only people already in our audiences</div><div class="list">'+a.custom.join(' · ')+'</div>';
    if(!a.rules.length) return '<div class="r">Broad — no interest rules</div>';
    return '<div class="r">'+a.rules.map(function(r){return r.replace(/ OR /g,' <b>OR</b> ');}).join(' <b>AND</b> ')+'</div>';
  }
  var live=sets.filter(function(a){return a.status==='ACTIVE';});
  var adsAll=sets.reduce(function(s,a){return s+a.ads.length;},0), adsLive=sets.reduce(function(s,a){return s+a.ads.filter(function(x){return x.status==='ACTIVE';}).length;},0);
  document.getElementById('stamp').innerHTML='<b>Pulled from Meta</b>'+C.pulled+'<br>Account 1459085242361281';
  document.getElementById('heronums').innerHTML=
    '<div class="hn"><div class="v">'+sets.length+'</div><div class="l">Ad sets</div></div>'+
    '<div class="hn"><div class="v">'+live.length+'</div><div class="l">Live now</div></div>'+
    '<div class="hn"><div class="v">'+money(live.reduce(function(s,a){return s+a.budget;},0))+'<small>/day</small></div><div class="l">Live daily budget</div></div>'+
    '<div class="hn"><div class="v">'+adsLive+'<small>/ '+adsAll+'</small></div><div class="l">Ads live / loaded</div></div>';
  document.getElementById('sets').innerHTML=sets.map(function(a,i){
    var on=a.status==='ACTIVE';
    var ads=a.ads.length?'<div class="ads">'+a.ads.map(function(ad){var l=ad.status==='ACTIVE';
      return '<div class="ad '+(l?'on':'off')+(ad.kind==='Static'?' static':'')+'"><div class="ph"><img src="'+ad.img+'" alt="'+ad.name+'"><span class="st">'+(l?'<span class="pill on">Live</span>':'<span class="pill off">Off</span>')+'</span></div><div class="nm">'+ad.name+'<small>'+ad.kind+' · Ad '+ad.id+'</small></div></div>';}).join('')+'</div>'
      :'<div class="empty">No ads loaded in this ad set</div>';
    return '<article class="set '+(on?'on':'off')+'">'+
      '<div class="shead"><div class="snum">'+String(i+1).padStart(2,'0')+'</div>'+
        '<div><div class="stitle">'+a.label+' '+st(a)+'</div><div class="ssub">CRM #'+a.crm+' · <span>'+a.name+'</span> · Ad set '+a.id+'</div></div>'+
        '<div class="budget"><div class="m">'+money(a.budget)+'<small>/day</small></div><div class="r">Daily budget</div></div></div>'+
      '<div class="cfg">'+
        '<div class="tile"><div class="k">Ages</div><div class="v">'+a.age+'</div></div>'+
        '<div class="tile"><div class="k">Location</div><div class="v txt">'+a.geo+'</div></div>'+
        '<div class="tile"><div class="k">Audience size</div><div class="v ice">'+size(a.size)+'</div></div>'+
        '<div class="tile"><div class="k">Advantage+ audience</div><div class="v">'+a.aplus+'</div></div>'+
        '<div class="tile"><div class="k">Placements</div><div class="v txt">'+a.placements+'</div></div>'+
        '<div class="tile"><div class="k">Optimisation</div><div class="v txt">'+a.opt+' · '+a.bid+(a.learning?' · '+a.learning.toLowerCase():'')+'</div></div>'+
      '</div>'+
      '<div class="rule"><div class="k">Who sees it '+tag(a)+'</div>'+rule(a)+'</div>'+
      '<div class="adsh"><div class="t">Ads in this ad set</div><div class="c">'+a.ads.filter(function(x){return x.status==='ACTIVE';}).length+' live · '+a.ads.length+' loaded</div></div>'+ads+
    '</article>';
  }).join('');
})();
</script>
</body>
</html>
